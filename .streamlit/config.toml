[server]
headless = true
maxUploadSize = 100
enableXsrfProtection = true

[runner]
# never print a bare expression's value on the page (it showed an internal object under 'Download')
magicEnabled = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#EF4444"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F5"
textColor = "#1F2937"
font = "sans serif"
